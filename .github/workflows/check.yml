name: Check human-please

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m json.tool skills.sh.json
      - run: python tools/maintain.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: human-please-${{ matrix.os }}
          path: |
            dist/human-please.skill
            dist/human-please.skill.sha256
          if-no-files-found: error
          retention-days: 7

  discovery:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npx --yes skills@1.7.2 add ./human-please --list
